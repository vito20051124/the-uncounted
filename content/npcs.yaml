- id: npc-quays-foreman
  name: 老克瓦
  at: bh:quays
  when:
    - 5
    - 9
  role: 碼頭工班監工
  race: 人類
  grade: 0 靈聾／閉血
  desc: |-
    五十來歲，左手少了兩根指頭，據說是二十年前被纜繩絞掉的。他不記人名，只記手——誰的手上有繭、誰的手是新的、誰的手在發抖。
    他自己也是靈聾。這件事他從不說，但整個碼頭都知道，所以沒有人在他面前提法術。
  effect: ★ 熟識度直接改變碼頭日工的錄取率。他認得你的臉之後，你就不再是人群裡的第六十幾張臉。
  src: derived:brinehaven/districts.md#碼頭區 監工挑人機制；occupations.md 年收與日薪衝突反推之錄取率
  talkLines:
    - |-
      他沒有停下手上的活。「繩圈。」他說，下巴往你腳邊點了一下。
      你退開半步，才看見自己剛才站的地方就是。
    - |-
      「今天的船從灰燼荒原那邊過來的。」他說，「貨會比較重，也比較髒。」
      他看了你的手一眼。「戴布。沒有布就撕衣角。」
    - |-
      你問他為什麼從來不記名字。
      「因為記了會難過。」他說完就走了，像是後悔講了這句。
    - |-
      他遞給你半塊鹽磚。「碼頭的規矩：分東西的人不會被搶。」
      你說謝謝。他說：「不是給你的，是給我自己的。」
    - |-
      「你走路的樣子變了。」他說。
      你問哪裡變了。
      「以前你會看地上。現在你會看兩邊。」他點頭，「這座城教的。」
- id: npc-cinder-woman
  name: 灰姐
  at: bh:cinder
  role: 灰盟難民自衛會的登記人
  race: 灰裔
  grade: 1 微感／蝕血
  desc: |-
    臉頰有蝕血特有的灰斑，說話時不看你的眼睛，只看你的鞋。她管的是灰棚巷的一本冊子——不是官方戶籍，是自衛會自己記的：誰住哪個棚、誰欠誰多少、誰死了。
    「城裡不收沒戶籍的。這裡收。」這句話她一天要說好幾遍。
  effect: ★ 她那本冊子是你在這座城裡唯一能被寫進去的東西。信任夠了，她會讓你上冊——那不是戶籍，但那是第一次有人在數你。
  src: canon:districts.md#灰棚巷 灰盟難民自衛會；_reaches-geopolitics.md 灰盟難民無戶籍
  talkLines:
    - |-
      她翻著冊子，沒有抬頭。「今天沒有新的。」
      停了一下。「這是好事。新的通常是有人搬進來，有人搬進來通常是因為別的地方待不下去。」
    - |-
      「你知道我們這裡最貴的東西是什麼嗎。」她問。
      你猜是藥。
      「是門板。」她說，「有門板的棚子，晚上可以睡熟。」
    - |-
      她給你看冊子上一個被劃掉又寫回去的名字。
      「他去年冬天沒了。」她說，「今年春天又回來了。」
      「所以我學會用炭筆——炭筆擦得掉。」
    - |-
      「城裡的人以為我們在這裡是因為懶。」她把冊子闔上，「他們沒看過退潮。」
      你問這是什麼意思。
      「潮退了，灘上什麼都撿得到。潮來了，你就在灘上。」
    - |-
      她今天心情好一點，願意看你的臉。
      「你不欠我。」她說，「我先講清楚，因為這裡的人都以為別人一定要他還。」
- id: npc-grotto-elder
  name: 石啞
  at: bh:grotto
  role: 寂裔石匠長老
  race: 寂裔
  grade: 0 靈聾／閉血
  desc: |-
    沒有人知道他幾歲。他不說話——石窟街上沒有人說話，他們用手勢與刻痕。
    他的手比你見過的任何一雙手都穩。你第一次走進石窟街的時候，他是唯一抬頭看你的人，而且只看了一眼就低回去了。
    那一眼你看得懂：他認出你的身體跟他一樣。
  effect: ★ 他是唯一不會問你從哪來的人——因為在他們的規矩裡，來歷是你自己的事。情感夠了，他會教你一件別人不會教的事。
  src: canon:districts.md#石窟街 寂裔緘默文化；canon-07 §4.1.4 她在體質上與寂裔同類
  talkLines:
    - |-
      他把鑿子交到你手上，握著你的手腕比了一下角度，然後放開。
      你敲了一下。歪的。
      他沒有搖頭，也沒有點頭。他只是等你敲第二下。
    - |-
      你在他旁邊坐了一會兒。他一句話都沒說——這裡沒有人說話。
      離開的時候他抬手，兩根手指併攏，往下輕輕一壓。
      年輕石匠替他翻譯：「他說『慢慢來』。」
    - |-
      他指了指工坊角落一塊沒刻完的石頭，又指了指你。
      年輕石匠說：「長老問你要不要試。」
      你搖頭。他笑了一下，把石頭推回原位。
    - |-
      外面下雨了。整條街的人停下手，聽了一分鐘，然後繼續。
      石啞比了一個手勢。
      「他說：『雨天石頭比較誠實。』」年輕石匠翻譯完自己也笑了，「我也聽不懂。」
    - |-
      他今天在磨一把很小的鑿子，磨了整個下午。
      你問要用來刻什麼。
      年輕石匠傳話：「長老說，不知道。先磨好。」
- id: npc-market-scribe
  name: 穗爾
  at: bh:market
  when:
    - 7
    - 17
  role: 集市書記的學徒
  race: 人類
  grade: 0 靈聾／閉血
  desc: |-
    二十出頭，袖口永遠沾著墨，右手中指有一塊寫字磨出來的硬繭。她是派工單的經手人——你每次跑腿，那張單子都是她寫的。
    她認得字。在這座城裡，認得字的人不多，而認得字又肯教別人的，一個也沒有。
    「我不是書記，」她會更正你，「我是書記的學徒。書記死了我才是書記。」
  effect: ★ 同輩。她是這座城裡唯一會問你「你以前是做什麼的」而不是「你從哪來」的人。友情與戀愛皆可達——但兩者都不會給你任何數值優勢。
  src: derived:job-market-errand 之「派工的書記」；districts.md#行會大市集 書記 12 銅/日
  talkLines:
    - |-
      她一邊寫一邊說話，筆沒有停。
      「你知道最難寫的字是什麼嗎。」
      「別人的名字。」她說，「寫錯了，那個人在紙上就是另一個人。」
    - |-
      她把一張寫壞的紙推給你。「練。」
      你說你會弄髒。
      「紙已經壞了。」她說，「壞掉的東西拿來練最好，因為你不會怕。」
    - |-
      「今天有人來寫遺書。」她說得很平，「三十七歲，碼頭的。他還沒死，他只是想先寫好。」
      她把墨蓋上。「我覺得這是我看過最勇敢的事。」
    - |-
      你問她書記為什麼不收學徒。
      「因為收了就要教。教了就會有人比你好。」她聳肩，「他七十三歲了，他怕。」
      停了一下。「我不想變成那樣。」
    - |-
      「你的字進步了。」她說。
      你說沒有。
      「有。」她指著紙，「上禮拜你寫『鹽』會漏一橫。今天沒漏。」
      你沒想到她記得。
- id: npc-quays-hand
  name: 闕
  at: bh:quays
  when:
    - 5
    - 20
  role: 碼頭散工
  race: 人類
  grade: 0 靈聾／閉血
  desc: |-
    跟你差不多年紀，扛得比你多一倍，話比你少一半。他在碼頭已經三年，每一枚銅都存著——存到六個金帝就買一張船票，他說得很清楚，清楚到你懷疑他每天晚上都要對自己說一遍。
    「你要去哪？」你問過一次。
    「不知道。」他說，「知道就不算走了。」
  effect: ★ 同輩。他懂潮汐、懂哪條路晚上不能走，也懂餓是什麼感覺。友情與戀愛皆可達——但戀愛會讓你面對一個問題：他存的錢是要離開的。
  src: derived:brinehaven/districts.md#鹽埠碼頭 碼頭散工；_economy.md 船票與金帝換算
  talkLines:
    - |-
      他遞給你一塊布。「綁手上。今天的箱子有刺。」
      你問他怎麼知道。
      「昨天綁的。」他舉起自己纏了布的手。
    - |-
      「今天的潮比昨天早四十分鐘。」他說。
      你問他怎麼算的。
      「不用算。」他指了指防波堤下面的水痕，「看那條線。」
    - |-
      他數了數今天的工錢，然後把其中兩枚分開放。
      你問那兩枚是什麼。
      「船票。」他說，「剩下的是吃飯。分開放才不會吃掉。」
    - |-
      「你晚上走哪條路回去？」他問。
      你說了。
      他搖頭。「潮汐日那條會積水，積水的地方看不到坑。」
      他用鞋尖在地上畫了另一條。「走這條。多六分鐘。」
    - |-
      兩個人坐在纜柱上吃東西，誰都沒說話。
      吃完他站起來，說：「明天也來。」
      然後補了一句：「不是叫你來。是說我明天也在。」
- id: npc-alley-neighbour
  name: 妲莎
  at: bh:alley
  when:
    - 6
    - 21
  role: 老鹽街三樓的鄰居
  race: 人類
  grade: 微感／薄血
  desc: |-
    四十出頭，三個孩子，一個丈夫在鹽埠。她在跨街晾衣繩上晾別人的衣服——替下城七戶人家洗，一戶一個月四銅。
    她整天都在同一個位置：樓梯轉角那扇窗前面，手在盆裡，眼睛在巷子上。所以她看得見每一個進出這條巷子的人，包括你第一天躺在牆邊的那個晚上。
  effect: 這條巷子沒有工作可做，所以認得她不會替你賺到一個銅。她給的是另一件事：一條巷子裡有人知道你昨天有沒有回來。
  src: canon:districts.md#鹽民下城與老鹽街區 密集 3–4 層石木混造出租公寓與跨街晾衣繩、衣物洗滌場；derived:洗衣一戶月 4 銅由既有洗滌場設定與粗工日薪內插
  talkLines:
    - |-
      「你昨天很晚。」她沒有抬頭，手還在盆裡。

      你正要解釋，她先說了：「不用講。我只是說一聲。」
    - |-
      她把一件擰乾的衣服甩開，水珠打在牆上。

      「這條繩子上第三件是我自己的。」她說，「前面兩件是別人的。你猜得出哪一件是我的嗎。」

      你猜了。你猜錯了。她笑了一聲，沒有告訴你哪一件才對。
    - |-
      「我在這條巷子住了十九年。」她說，「來過很多人。」

      她停了一下，把手在圍裙上擦乾。

      「大部分我到最後都不知道他們叫什麼。不是我不問——是他們走得比我問的速度快。」
    - |-
      她指了一下牆邊那個位置——你第一天躺的那裡。

      「你不是第一個躺在那裡的。」她說，「但你是第一個第二天還在的。」
- id: npc-cathedral-almoner
  name: 修士歐倫
  at: bh:cathedral
  when:
    - 7
    - 17
  role: 孤兒救濟院的發放修士
  race: 人類
  grade: 常階／匯血
  desc: |-
    五十幾歲，歸復教會的灰袍，袖口洗得發白。他每天早上在孤兒院側門發白堊麵包和濃湯，發到沒有為止。
    他有通路，是常階。所以他【可以】施法，而他每天做的事是拿勺子。這件事他不覺得有什麼衝突，你也不必替他覺得。
  effect: 他不會問你是誰、不會要你的通行牌，也不會替你向教會求任何東西。他只會給你一份麵包和一份濃湯，一天一次。
  src: canon:districts.md#聖鹵大聖堂區 孤兒院每日提供免費白堊麵包與濃湯、歸復教會鹵港大聖堂、人類 65%
  talkLines:
    - |-
      他把勺子在鍋邊敲了一下。「還熱。」

      你伸手接的時候他多看了一眼你的手，但什麼都沒問。
    - |-
      「你不是這一區的人。」他說。

      這不是質問，是陳述。你正在想怎麼回答，他已經把下一碗遞給後面那個孩子了。
    - |-
      你問他為什麼不問任何人的來歷。

      「因為問了我就要決定。」他說，「我不想決定誰該吃。」
    - |-
      「聖水對某些人沒有作用。」他忽然說，手上還在舀。

      「教會的說法是他們的靈血通路閉著。我的說法是——那就換一種給。」

      他把碗遞給你。「這個對每一種人都有作用。」
- id: npc-yards-ropewalker
  name: 老繩子
  at: bh:yards
  when:
    - 6
    - 16
  role: 繩纜編織工頭
  race: 灰裔
  grade: 微感／蝕血
  desc: |-
    灰裔，手掌上的皮厚到像另一層手套。他在船塢路盡頭那條長棚裡打繩——一條主纜要三個人同時走三十步，一步錯了整條就廢。
    造船工匠行會對外人警惕，而長棚是行會的地方。他不會因為你缺錢就讓你進去；他要有人替你說一句話，或者他自己看你看夠久。
  effect: 打繩這份工不是靠運氣也不是靠身體，是靠有人肯讓你進門。他不認得你之前，你連排隊的資格都沒有。
  src: canon:districts.md#鐵根造船區 繩纜編織、造船工匠行會與黑匠公會「工會高度自我管理，對外人警惕」、灰裔 400 人 23.5%
  talkLines:
    - |-
      他沒有停下腳步——打繩的人不能停。

      「站遠一點。」他說，「繩子斷的時候會抽人。」
    - |-
      「三十步。」他說，「三個人一起走，同一個速度。快的那個會害死慢的那個。」

      他看了你一眼。「你走路很快。這不是好事。」
    - |-
      你問他為什麼行會不收外人。

      「不是不收。」他說，「是收了要有人擔。你斷了一條主纜，那條纜的錢從擔你的人身上扣。」

      他把手上那股繩甩到肩上。「你會替一個不認識的人押錢嗎。」
    - |-
      他把一小段廢繩塞給你。「拿去。」

      你問這要做什麼。

      「練。」他說，「先繞兩圈，回頭穿過去，不要拉死。手會記得，腦子不會。」
