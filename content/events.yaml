        但至少今天不用餓著睡。
  src: canon:_economy.md 銅幣 8.0g 純銅；canon-07 §5.1 外來之物的物理地位
  name: 第一筆工錢
- id: ev-census-notice
  name: ★ 普查公告
  where:
    at: bh:market
  when:
    hours:
      - 7
      - 18
  requires:
    not:
      flag: census-warned
  once: true
  weight: 62
  text: |-
    告示牆上釘了一張新的，紙比旁邊的白得多。

    人圍了一圈，識字的那個唸出聲：

    「……奉領事會令，枯收季末於城內各區行例次戶口清點。凡在籍者持籍牌候查，凡不在籍者限十日內至區署補登。逾期查獲，依《港律》第九條扣留，遣送蒸發池勞役抵費。」

    人群安靜了一下，然後有人笑了一聲：「補登要三個金帝。」

    三個金帝是七百二十銅。你算了一下：你一天賺不到十五銅。
  choices:
    - label: 把整張看完，記住日期
      cost:
        minutes: 15
      gain:
        flag: census-warned
      resultText: |-
        你把日期記下來了。十日。

        你也看清楚了最下面那一行小字——寫的是「清點以區署名冊為準，名冊之外者視同無籍」。

        **名冊之外者視同無籍。**

        你就是名冊之外的那個。你不是被漏掉的，你是從來沒有被寫進去過的。
    - label: 擠出人群，當作沒看見
      cost:
        minutes: 5
      resultText: |-
        你走開了。

        公告還在那裡。它不會因為你沒看而不生效——這一點，之後會有人來提醒你。
  src: canon:canon-07 §6 普查未及者；world/factions/reaches-ledger.md 諸境普查制度
- id: ev-dross-appraise-grotto
  name: ★ 石啞看那片殘滓
  requires:
    all:
      - all:
          - at: bh:grotto
          - has:
              item: item-dross-shard
          - not:
              flag: dross-sold
          - not:
              flag: dross-identified
      - day: ">=3"
  once: true
  weight: 72
  text: |-
    石窟街沒有人說話。你走進工坊的時候，只有鑿子敲石頭的聲音，一下、一下，很慢。

    石啞抬頭看你。你把袖口裡那片東西攤在手心。

    他放下鑿子。

    他沒有碰它——他用一片薄薄的青石板從下面把它托起來，舉到光裡看。然後他做了一件你看不懂的事：他把石板拿到耳邊，等了一會兒。

    寂裔沒有靈血通路，他們不「感覺」靈血。他們**聽**。這是無血工藝：不靠感應，靠共振。

    他放下石板，看著你，看了很久。

    然後他抬起兩隻手，比了一個手勢：先是一個很大的圓，然後五指張開，猛地收攏成拳。
  tell: 整條街上，只有他手上的鑿子停了。
  choices:
    - label: 問那是什麼意思
      cost:
        minutes: 45
      gain:
        flag: dross-identified
        npc:
          id: npc-grotto-elder
          acquaintance: 12
          trust: 15
          fact: ★ 他知道那片滓是元血級的
      resultText: |-
        旁邊一個年輕石匠替他翻譯，聲音壓得很低——石窟街說話要壓低，這是規矩。

        「大的滿的東西，一次空掉。」

        他停了一下，補充：「長老說，這種東西他這輩子見過兩次。一次在星坑的展櫃裡，隔著玻璃。一次是現在。」

        石啞又比了一個手勢——這次很短：手掌向下，往旁邊一抹。

        「不要問你從哪裡拿到的。」年輕石匠說，「這是我們的規矩。來歷是你自己的事。」

        他把那片殘滓推回你手裡。他沒有想要它。

        **這是你來到這裡之後第一次，有人知道了關於你的一件真事，然後選擇不追問。**
    - label: 收回來，什麼都不說
      cost:
        minutes: 10
      gain:
        npc:
          id: npc-grotto-elder
          acquaintance: 5
      resultText: |-
        你把手心收攏。

        石啞看了你的手一眼，然後點了一下頭——不是失望，也不是理解，就只是「知道了」。

        他拿起鑿子，繼續敲。一下、一下。

        那片殘滓還在你身上。
  src: canon:canon-07 §4.1.4 她與寂裔在體質上不可區別；faction-silentcourt-craft 無血工藝純機械
- id: ev-dross-buyer
  name: ★ 灰棚巷的買家
  requires:
    all:
      - all:
          - at: bh:cinder
          - has:
              item: item-dross-shard
          - flag: dross-lead
          - not:
              flag: dross-sold
      - day: ">=3"
  once: true
  weight: 74
  tell: 灰姐說過，知道這種滓值多少錢的人已經死了兩個。
  text: |-
    一個你沒見過的男人在棚屋之間攔住你。他的斗篷太乾淨了，不是這條巷子的人。

    「聽說你手上有東西。」

    他沒有自我介紹，也沒有問你的名字。他攤開手掌，掌心裡是一疊銅——你從來沒有一次看過那麼多銅。

    「一百二十。」他說，「我不問來歷，你不問去處。」

    一百二十銅。你扛一天鹽袋是十五銅，而且六成機率挑不上你。這是你八天的命。

    他等著。他不催——他知道他不需要催。
  choices:
    - label: 賣掉
      cost:
        minutes: 30
      spend:
        item: item-dross-shard
      gain:
        copper: 120
        flag: dross-sold
      resultText: |-
        銅落進你手裡的時候比你想像的重。

        他把那片殘滓包進一塊黑布，動作很熟練——熟練到你確定他做過很多次。

        「你很聰明。」他走之前說，「留著那種東西的人，通常留不久。」

        你回頭想問他是誰，但棚屋之間已經沒有人了。

        **你有錢了。而且世界上唯一能證明那件事發生過的東西，現在在別人手上。**
    - label: 說不賣
      cost:
        minutes: 15
      gain:
        flag: dross-kept
      resultText: |-
        他把手合起來，一點也不意外。

        「行。」他說，「東西在你身上，價錢就在我這裡。哪天餓了，來灰棚巷問『收滓的』。」

        他走了兩步，又停下來，沒有回頭：

        「不過我提醒你一件事——會來問你的，不會只有我一個。」
    - label: 反問他為什麼要
      requires:
        npc:
          id: npc-cinder-woman
          axis: trust
          is: ">=30"
      cost:
        minutes: 40
      gain:
        flag: dross-kept
        npc:
          id: npc-cinder-woman
          trust: 8
      resultText: |-
        他笑了，第一次。

        「因為它是空的。」他說。

        「靈血滓通常還帶著一點餘息，像剛熄的爐子。這一片什麼都沒有——它不是慢慢用完的，是**一次被抽乾的**。這種東西只有元血之世的機關會留下。」

        他收起銅。「而元血之世的機關，全諸境登記在案的只有十一台，全部是死的。」

        他看了你一眼。「所以要嘛是有人叫醒了一台，要嘛是有第十二台。」

        「這兩個答案，哪一個都值一百二十銅以上。」

        ——後來你把這段話講給灰姐聽。她聽完只說了一句：「他沒騙你。這就是他可怕的地方。」
  src: canon:canon-07 §1 誤觸發、§3 守恆；灰盟遺物黑市；_economy.md 粗工日薪 8–15 銅
- id: ev-guard-census
  name: ★★ 城衛查籍
  requires:
    all:
      - all:
          - at:
              - bh:market
              - bh:quays
          - flag: saw-dross
          - not:
              flag: identity-obtained
          - not:
              flag: census-passed
          - not:
              flag: census-fled
      - day: ">=4"
  when:
    hours:
      - 8
      - 17
  once: true
  weight: 88
  tell: 街口那兩個人穿的是港衛的深藍。其中一個手上拿著名冊——那本名冊上沒有你。
  text: |-
    兩名港衛從街口走過來，一個拿冊子，一個拿短棍。他們不趕時間，一個一個問。

    前面那個賣魚的女人從腰帶裡掏出一塊木牌，拿冊子的看了一眼，點頭，過。
    再前面一個，翻了半天口袋，拿出一張蓋了印的紙。看一眼，點頭，過。

    輪到你之前，你有大約二十秒。

    你身上沒有木牌，沒有紙，沒有印。你不在任何一本冊子上——不是被劃掉，是從來沒有被寫上去。

    「籍。」拿冊子的說。他沒有抬頭。
  choices:
    - label: 轉身就走
      cost:
        minutes: 60
        stamina: -25
      gain:
        flag: census-fled
      risks:
        - chance: 0.35
          tell: 拿短棍的那個抬起了頭。
          injury: 被短棍掃到的小腿
      resultText: |-
        你退進人群裡，然後走，然後跑。

        身後有人喊了一聲。你沒有回頭。

        你繞了很遠才敢停下來，肺在燒。

        你安全了——今天。但那本冊子上現在多了一件事：**有一個人在被問到籍的時候跑了。**

        這座城不大。
    - label: 拿出灰姐冊子上的那一頁
      requires:
        flag: on-cinder-ledger
      cost:
        minutes: 45
      gain:
        flag: census-passed
        npc:
          id: npc-cinder-woman
          trust: 5
      resultText: |-
        你把那張灰姐撕給你的紙遞過去。

        拿冊子的看了三秒，鼻子裡哼了一聲。

        「難民自衛會的。」他說，「這不算籍。」

        他把紙丟回來。你以為完了。

        然後他在冊子上劃了一筆：「補登期內，暫記待查。十日後再查到你還是這張，就走一趟區署。」

        他們走了。

        你站在原地，手在抖。

        **那張不算籍的紙，替你買了十天。** 灰姐當時說「領事會不認」——她說得對，但她沒說「不認」和「不理」是兩件事。
    - label: 掏出所有的錢
      requires:
        copper: ">=40"
      cost:
        minutes: 30
      spend:
        copper: 40
      gain:
        flag: census-passed
      resultText: |-
        你把銅塞進他手裡。

        他沒有數，直接進了口袋。拿短棍的那個看著別的地方。

        「補登期內，暫記待查。」他念了一句，像念咒。冊子上劃了一筆。

        他們走了。

        你少了四十銅——將近三天的工錢——換來一句「暫記待查」。

        **而且你現在知道了一件事：這條路是可以用錢走的。**
        這既是好消息也是壞消息，因為你沒有錢。
    - label: 什麼都沒有，站著
      cost:
        minutes: 240
        stamina: -30
        hygiene: -25
      gain:
        flag: census-fled
      risks:
        - chance: 0.5
          tell: 扣留所的地是濕的。
          injury: 扣留所留下的擦傷
      resultText: |-
        「沒有。」你說。

        拿冊子的終於抬起頭，看了你一眼——不是憤怒，是那種看一件待辦事項的眼神。

        「帶走。」

        扣留所是碼頭邊一間石屋，裡面已經有七個人。沒有人問你名字，因為登記的人要到下午才來，而下午他沒有來。

        傍晚他們把你們放了，因為石屋要用來關別的人。

        出來的時候天已經黑了。你損失了一整個下午，餓，髒，而且**冊子上現在有你了**——只不過那一欄寫的是「無籍，暫縱」。

        你第一次被這座城寫下來，用的是這四個字。
  src: canon:canon-07 §6 普查未及者無法律人格；《港律》扣留與勞役抵費；領事會戶口清點
- id: ev-path-token
  name: ★★ 路 A · 老克瓦的工牌
  requires:
    all:
      - all:
          - at: bh:quays
          - npc:
              id: npc-quays-foreman
              axis: trust
              is: ">=35"
          - any:
              - flag: census-passed
              - flag: census-fled
          - not:
              flag: identity-obtained
      - day: ">=7"
  when:
    hours:
      - 5
      - 10
  once: true
  weight: 80
  text: |-
    收工的時候老克瓦叫住你。他沒有看你的臉，他看你的手。

    他抓起你的右手翻過來，用拇指按了按虎口和指根。

    「繭。」他說。

    他放開。「一個月前你這裡是軟的。」

    他從木棚裡拿出一塊東西——一片打磨過的硬木，上面烙了行會的印，還有一個空著的名字欄。

    「臨時工牌。行會發的，一年一換。它不是籍——」他強調，「它不能租房，不能告人，死了也不會有人賠你。」

    「但港衛看到它會放你過去，因為它證明有人願意為你的工掛名。」

    他把工牌放在木箱上，沒有遞給你。

    「掛名的是我。你要是出事，扣的是我的工班。」
  tell: 他說這句話的時候，第一次看了你的臉。
  choices:
    - label: 接下來
      cost:
        minutes: 60
      gain:
        flag:
          - path-token
          - identity-obtained
        npc:
          id: npc-quays-foreman
          trust: 25
          affection: 10
          fact: ★ 他用自己的工班替你掛名
      resultText: |-
        你拿起那塊木牌。它比看起來重。

        「名字自己刻。」他說，「刻歪了不換。」

        你在空欄上刻下你的名字——你原本的名字，用這裡的寫法。刻得很慢，因為手在抖。

        老克瓦看完，把牌子丟回給你，轉身走了。走了幾步他說：

        「明天五點。遲到不等。」

        **這是你在這個世界上第一件寫著你名字、而且別人會承認的東西。**
        它不是籍。但它是一個開始。
    - label: 問他為什麼願意
      cost:
        minutes: 30
      gain:
        flag:
          - path-token
          - identity-obtained
        npc:
          id: npc-quays-foreman
          trust: 30
          affection: 18
          fact: ★ 二十年前也有人替他掛過名
      resultText: |-
        他停了很久。久到你以為他不會回答。

        「二十年前我這隻手剛沒的時候，」他舉起左手，兩根指頭的位置什麼都沒有，「沒有人要一個殘廢的搬運工。」

        「有個人替我掛了名。他姓什麼我不記得了——我不記名字。」

        他放下手。

        「我記手。他的手也少東西。」

        他把工牌推過來。

        「拿著。別讓我後悔。」
    - label: 不接——你不想欠他
      cost:
        minutes: 15
      gain:
        npc:
          id: npc-quays-foreman
          acquaintance: 5
          trust: -5
      resultText: |-
        「我不能讓你擔這個。」你說。

        他看著你，好一會兒。

        「隨你。」他把工牌收回木棚，「東西放這裡。想通了自己來拿。」

        他沒有生氣。但他也沒有再提。

        **在鹵港，客氣是一種昂貴的東西。**
  src: canon:brinehaven/districts.md#鹽埠碼頭 行會臨時工牌；canon-07 §6 無籍者無法律人格
- id: ev-path-forge
  name: ★★ 路 B · 灰姐的那一行
  requires:
    all:
      - all:
          - at: bh:cinder
          - flag: on-cinder-ledger
          - npc:
              id: npc-cinder-woman
              axis: trust
              is: ">=45"
          - any:
              - flag: census-passed
              - flag: census-fled
          - not:
              flag: identity-obtained
      - day: ">=7"
  once: true
  weight: 80
  tell: 她把門關上了。這是你第一次看到灰棚巷有人關門。
  text: |-
    灰姐帶你進了棚屋裡面。她把門板拉上——灰棚巷的棚子平常不關門，因為關門會讓人以為裡面有東西。

    她從床板下面抽出另一本冊子。這一本比較新，也比較薄。

    「區署的抄本。」她說，「每季一份，錯漏由自衛會回報。」

    她翻到中間，指著一行被劃掉的名字。

    「這個人上個月死了。我還沒報。」

    你花了三秒才聽懂她的意思。

    「一個死人的籍，跟一個活人的籍，在紙上長得一模一樣。」她說，眼睛還是看著你的鞋，「我把死劃掉的那一筆擦了，你就是他。」

    她抬起眼。

    「六十銅。不是給我的——是給區署謄寫的那個人的。他要吃飯，也要冒險。」
  choices:
    - label: 付錢，接下這個名字
      requires:
        copper: ">=60"
      cost:
        minutes: 120
      spend:
        copper: 60
      gain:
        flag:
          - path-forge
          - identity-obtained
        npc:
          id: npc-cinder-woman
          trust: 20
          fact: ★ 你用了一個死人的籍
      resultText: |-
        你把六十銅數給她。她一枚一枚地收，很慢，像在確認你真的想清楚了。

        「他叫**厄岱**。」她說，「鹽澤生人，四十一歲，妻死無子。你現在四十一歲了。」

        「沒有人會查一個窮人的臉。他們只查冊子上有沒有這一行。」

        她把冊子收回床板底下。

        「有兩件事你要記住。」她豎起兩根手指。

        「第一，厄岱有債。我不知道多少，也不知道欠誰。」

        「第二——」她停頓，「你欠我一件事。我不會現在跟你要。」

        **你有籍了。你也有了一個你從未見過的人的一生。**
    - label: 問那個人是怎麼死的
      cost:
        minutes: 45
      gain:
        npc:
          id: npc-cinder-woman
          acquaintance: 10
          trust: 8
      resultText: |-
        「餓死的。」她說得很快，像早就準備好了這個答案。

        然後她補了一句，比較慢：

        「不是。是他病了，賣了棚子買藥，藥沒用，然後沒地方睡，然後冬天到了。」

        她把冊子闔上。

        「所以是餓死的。這裡的人都是餓死的，只是繞的路不一樣。」

        她看著你。「還要嗎？」

        ——這句話你沒有立刻回答。
    - label: 拒絕——你不想用死人的名字
      cost:
        minutes: 20
      gain:
        npc:
          id: npc-cinder-woman
          acquaintance: 5
          affection: 8
      resultText: |-
        「我不要。」

        她沒有勸你。她把冊子收好，重新把門板推開，讓光進來。

        「這是我聽過最貴的一句話。」她說。

        「不過我懂。你把那一行拿走，厄岱就真的沒有了——連死都沒有人記得他死過。」

        她坐回門口的位置，攤開她自己那本破冊子。

        「隨時可以改主意。他不會更死。」
  src: canon:_reaches-geopolitics.md 灰盟難民無戶籍；領事會區署名冊季抄本；canon-07 §6
- id: ev-path-vouch
  name: ★★ 路 C · 石窟街的擔保
  requires:
    all:
      - all:
          - at: bh:grotto
          - flag: dross-identified
          - npc:
              id: npc-grotto-elder
              axis: affection
              is: ">=25"
          - any:
              - flag: census-passed
              - flag: census-fled
          - not:
              flag: identity-obtained
      - day: ">=7"
  once: true
  weight: 82
  tell: 整條街的鑿子都停了。這在石窟街是沒有發生過的事。
  text: |-
    他們在工坊中間放了一張矮凳，示意你坐下。

    然後石啞做了一件事：他握住你的手腕，把兩根手指按在你的脈上，閉起眼睛。

    很久。長到旁邊的年輕石匠都開始不安。

    你知道他在做什麼——寂裔驗血裔的老方法，不靠感應，靠聽。他在聽你身體裡有沒有靈血在走。

    **沒有。** 你的身體裡什麼都沒有在走，跟他一樣，跟這條街上每一個人一樣。

    他放開手，睜開眼睛。

    他比了一個手勢：兩隻手掌相對，然後扣在一起。

    年輕石匠翻譯的時候聲音有點抖：

    「長老說——**同的**。」

    「他說，寂庭認的不是姓，是血。你的血跟我們一樣是空的。」

    「他要替你出擔保狀。」
  choices:
    - label: 接受擔保
      cost:
        minutes: 180
      gain:
        flag:
          - path-vouch
          - identity-obtained
        npc:
          id: npc-grotto-elder
          trust: 30
          affection: 20
          fact: ★ 寂庭在紙上認了你
      resultText: |-
        擔保狀不是寫的，是刻的。

        他們拿出一塊掌心大的青石片，石啞親手刻——刻得極慢，一個字要好幾分鐘。整個工坊沒有人動，所有人看著。

        刻完之後，他把石片浸進一盆水裡，然後遞給你。石片是溫的。

        年輕石匠說：「上面刻的是：**此人無血，寂庭具保。**」

        「領事會認寂庭的保。不是因為喜歡我們，是因為我們的保從來沒有出過錯——三百年沒有出過錯。」

        他頓了一下。

        「所以你要知道你拿的是什麼。你出事，不是你一個人出事。」

        **在這個世界上，唯一能證明你是自己人的東西，是那個讓你永遠不能施法的缺陷。**

        你的殘疾就是你的護照。
    - label: 問他為什麼願意保一個外人
      cost:
        minutes: 60
      gain:
        flag:
          - path-vouch
          - identity-obtained
        npc:
          id: npc-grotto-elder
          trust: 35
          affection: 28
          fact: ★ 他說你不是外人
      resultText: |-
        石啞聽完，做了一個很短的手勢，只有一下。

        年輕石匠愣了愣，然後笑了——這是你第一次看到石窟街有人笑。

        「長老說：『你問錯了。』」

        石啞又比了一次，這次很慢，讓你看清楚：他指了指你的胸口，然後指了指自己的，然後把兩根食指併在一起。

        「他說，外人是有血的那些。」

        「你不是外人。你只是**還沒回家**。」

        ——你在那張矮凳上坐了很久，久到鑿子的聲音重新響起來。

        你沒有讓任何人看見你的臉。
    - label: 說你不配
      cost:
        minutes: 30
      gain:
        npc:
          id: npc-grotto-elder
          affection: 10
      resultText: |-
        你搖頭。你說你不是寂裔，你只是碰巧測起來一樣。

        年輕石匠把話比給石啞看。

        石啞聽完，聳了聳肩——一個非常人類的動作，出現在他身上很奇怪。

        他比了三個字。

        「隨你。」

        然後他拿起鑿子。

        那塊沒刻完的青石片，他放在工作檯的角落，沒有收起來。

        它就一直放在那裡。
  src: canon:canon-07 §4.1.4 以任何測法皆與土生閉血者不可區別；寂庭具保制度；faction-silentcourt 無血工藝
- id: ev-meet-scribe
