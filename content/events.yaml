      knowsRoute: e:quays-grotto-stair
  weight: 18
  cooldownDays: 2
  text: |-
    一個寂裔石匠扛著鑿具走向街尾，在兩座貨棚之間的縫裡側身進去，就不見了。
    你走過去看：那裡有一道石階，往下，沒有標記，也沒有燈。
  choices:
    - label: 記住這個位置
      cost:
