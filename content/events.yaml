        stamina: -8
      risks:
        - chance: 0.18
          tell: 早上起來喉嚨是痛的。
          injury: 受寒
      resultText: 天亮的時候雨停了。你的手指凍得不太聽話。
    - label: 用打火機生一小堆火
      requires:
