  once: true
  weight: 58
  text: |-
    收工之後他沒有回工棚，往防波堤外面走。你跟過去。

    他坐在堤頭，看著海。天快黑了，遠處有兩盞燈在動——出港的船。

    他從腰帶裡掏出一個布包，打開，裡面是一疊銅，用麻線分成幾綑。

    他當著你的面數了一遍。數完了說：

    「四個金帝又八十。」

    「六個金帝就能買一張到春冕都的統艙。」

    他把布包收回去，綁得很緊。
  choices:
    - label: 問他為什麼要走
      cost:
        minutes: 60
      gain:
        flag: bond-hand-1
        npc:
          id: npc-quays-hand
          acquaintance: 10
          trust: 18
          affection: 10
      resultText: |-
        他想了很久。久到你以為他在編。

        「因為這裡我全部都知道了。」他終於說。

        「哪個時辰漲潮、哪個監工要塞錢、哪條巷子晚上不能走、哪家的魚是隔夜的。」

        「三年。全部都知道了。」

        他看著那兩盞燈。

        「一個地方你全部都知道了，你就不會再學到東西了。不學東西的人會變成老克瓦。」

        他馬上補一句：「我不是說老克瓦不好。我是說他四十歲的時候應該也存過錢。」
    - label: 說你也想要一張
      cost:
        minutes: 45
      gain:
        flag: bond-hand-1
        npc:
          id: npc-quays-hand
          acquaintance: 14
          trust: 12
          affection: 6
      resultText: |-
        他笑了一聲，不是嘲笑。

        「你連籍都沒有。」

        「統艙要驗籍。沒籍的上不了船——上得了的那種船，你不會想上。」

        他把布包按了按。

        「所以你要先有名字，才能有船票。」

        他站起來拍拍褲子。「順序不能反。這裡的人一半都搞錯順序，然後在灰棚巷待一輩子。」

        ——這是第一次有人跟你解釋，為什麼「籍」比錢先。
    - label: 什麼都不問，陪他坐著
      cost:
        minutes: 90
      gain:
        flag: bond-hand-1
        npc:
          id: npc-quays-hand
          trust: 22
          affection: 18
      resultText: |-
        你在他旁邊坐下。

        兩個人看著那兩盞燈越來越小，然後看不見了。

        天全黑之後他說：「你不問。」

        「你想說會說。」

        他沉默了一下，然後：「這裡沒有人這樣。這裡的人問問題是為了知道能不能占你便宜。」

        又過了很久。

        「你欠我的那半個麵包，」他說，「不用還了。」

        ——你知道這句話對他來說是很大的一句話，因為他記得每一筆。
  src: canon:_economy.md 1 金帝 = 240 銅、統艙票價；derived:npc-quays-hand
- id: ev-hand-choice
  name: ★ 闕要走的那天
  requires:
