        copper: 1
      gain:
        treatInjury: herbs
      resultText: 你把傷口洗淨，敷上藥膏。
    - label: 貼一片 OK 繃
      requires:
        has:
          item: item-bandaid
      cost:
        minutes: 5
      spend:
        item: item-bandaid
      gain:
        treatInjury: sterile
      resultText: 你撕開那片薄薄的東西貼上去。它乾淨得不像這個世界的——
    - label: 重新包好就算了
      cost:
        minutes: 5
      resultText: 你把布條纏回去。它還是髒的。
