              flag: bond-grotto-1
      - day: ">=2"
  once: true
  weight: 56
  text: |-
    你在石窟街待久了會發現一件事：這裡不是安靜，是**滿的**。

    手一直在動。兩個石匠隔著半條街用手講話，速度快到你看不清。旁邊有人笑——笑是有聲音的，但笑完立刻收住。

    一個年輕石匠走過來，把手舉到你面前，很慢地比了三下。

    然後他等著。

    你不知道那是什麼意思。
  choices:
    - label: 照著比一次
      cost:
        minutes: 60
      gain:
        flag: bond-grotto-1
        npc:
          id: npc-grotto-elder
          acquaintance: 12
          affection: 15
      resultText: |-
        你舉起手，笨拙地照著比了一遍。

        他點頭，然後比了另外三下，比較快。

        你又照做。

        第七次的時候他終於開口了——聲音壓得極低：

        「你剛剛說的是『我不會說話』。」

        他指了指街上：「這裡每一個人第一句學的都是這個。」

        「因為承認自己不會，才有人願意教你。」

        他又比了一次，這次很慢：「這個是『慢一點』。你會用到很多次。」

        遠處，石啞停下鑿子看了這邊一眼，然後繼續。
