      resultText: |-
        她把筆放下。

        「因為『從哪來』是問你的過去屬於誰。」她說，「『做什麼的』是問你這個人會什麼。」

        「我對第一個沒興趣。」

        她重新拿起筆。「我叫穗爾。單子上第三行寫你的名字，寫清楚一點，我看不懂的我不派。」
    - label: 不回答，拿了單子就走
      cost:
        minutes: 5
      gain:
        npc:
          id: npc-market-scribe
          acquaintance: 4
      resultText: |-
        她聳肩，繼續寫下一張。

        你走到街口才想起來，她沒有堅持。這座城裡的人問問題通常都會堅持。
