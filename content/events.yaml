        你在簷下用撿來的木板生了一小堆火。
        火光照出巷子對面幾雙眼睛——他們沒有過來，只是看著。

        在這個世界，火不是奇蹟，但無燧生火是。
  src: derived:P0 設於枯收季，體溫僅於夜間露宿作用
  name: 下半夜的雨
- id: ev-meet-foreman
  where:
    at: bh:quays
  when:
    hours:
      - 5
      - 9
  once: true
  weight: 60
  text: |-
    監工從木棚裡出來，手上拿著一根粉筆。他點人的方式很簡單：走過去，看一眼手，粉筆在肩膀上劃一道，就算錄取。
    輪到你的時候他停了半秒。

    「新的。」他說。不是問句。
    他的左手少了兩根指頭。他沒有看你的臉，只看你的手——你的手很乾淨，指節上沒有繭。

    「叫什麼？」
  choices:
    - label: 報上名字
      cost:
        minutes: 5
      gain:
        npc:
          id: npc-quays-foreman
          acquaintance: 12
          trust: 5
      resultText: |-
        他沒有重複，也沒有記在哪裡。「老克瓦。」他說了自己的名字，就往下一個人走過去。

        後來你才知道：他不記名字，他記手。而現在他記住了一雙沒有繭的手。
    - label: 不說，只把手伸出去
      cost:
        minutes: 5
      gain:
        npc:
          id: npc-quays-foreman
          acquaintance: 8
          trust: 10
      resultText: |-
        他看了你的手很久，然後點了點頭。
        「這裡一半的人也不說。」粉筆在你肩上劃了一道。

        在鹵港，不問來歷是一種禮貌，也是一種生意。
  src: derived:npc-quays-foreman；districts.md#碼頭區 監工挑人
  name: 初見老克瓦
