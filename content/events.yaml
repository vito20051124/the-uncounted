  text: |-
    灰姐的棚子後面有一個小孩，五六歲，蹲在地上用石頭排東西。

    他排的是一排小石子，一顆一顆，非常整齊。排完了推倒，再排一次。

    你蹲下來看。他抬頭，臉頰上有跟灰姐一樣的灰斑——蝕血。

    他指著那排石頭，然後指著自己，說了一個字：

    「數。」

    他在數自己。他排一顆石頭，數自己一次。
  tell: 灰姐從棚子裡出來，站在門口沒有進來。
  choices:
    - label: 陪他排
      cost:
        minutes: 60
      gain:
        flag: bond-cinder-1
        npc:
          id: npc-cinder-woman
          trust: 15
          affection: 18
      resultText: |-
        你也撿了一顆石頭放上去。

        他看著那顆多出來的石頭，看了很久，然後抬頭看你。

        然後他又放了一顆。

        你們兩個把那排石頭排到牆邊，一共四十幾顆。他每放一顆就笑一次。

        灰姐在門口站到最後，然後說：

        「他媽去年冬天沒了。他不會講幾個字，但他會數。」

        她走回棚子裡。走之前說：

        「我那本冊子，就是這樣開始的。」
    - label: 問灰姐這孩子是誰的
      cost:
