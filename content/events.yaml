  lethal: false
  tell: 身後那個腳步聲，你在上一個轉角就聽見了——它跟你轉了同一個彎。
  text: 巷子裡沒有燈。你聽見身後有腳步聲，跟了你兩個轉角。
  choices:
    - label: 加快腳步
      cost:
        minutes: 8
        stamina: -6
      risks:
        - chance: 0.25
          tell: 有人從側巷伸手抓住你的包帶。你甩開了，但摔在泥裡。
          injury: 擦傷
          loseCopper: 4
      resultText: 你走出巷口，腳步聲沒有跟出來。
    - label: 掏出手機，把那道光打向身後
      requires:
        has:
          item: item-phone
      cost:
        minutes: 5
      gain:
        flag: used-phone-light
      resultText: |-
        你按下側鍵。

        一道白光射出去，亮得不像這個世界的任何東西——比油燈亮十倍，而且是冷的、直的、沒有火焰在抖。

        巷子盡頭那個人整個人僵住，然後往後退了三步，撞到牆。

        「……」他發出一個不是字的聲音，轉身跑了。

        你贏了。

        （但你也在一條有人的巷子裡，舉著一樣這個世界不該有的東西。電量少了一格——**它永遠不會再回來**。）
