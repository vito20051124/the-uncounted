      resultText: |-
        「去。」你說。

        他愣住了。

        「你不勸？」

        「你存了三年。」

        他低頭看著布包，很久。然後他把布包收起來，綁緊。

        「好。」

        第九日的早潮，你去送他。他在跳板上回頭，做了一個很短的動作——把手舉到肩膀的高度，然後放下。

        那是碼頭工人被粉筆點到名時的動作。

        **「算你錄取了。」**

        船開了之後你在堤頭站了一陣子。你發現你不難過，你只是覺得這座城少了一塊。

        （他留了一張紙條在你的工棚：**「欠你的那半個，去春冕都找我拿。」**）
    - label: 叫他去，然後說你會等他回來
      cost:
        minutes: 90
      gain:
        flag: romance-hand
        npc:
          id: npc-quays-hand
          trust: 30
          affection: 30
          fact: ★ 你和闕在一起了，而他上了船
      resultText: |-
        「去。」你說。

        「然後回來。」

        他看著你，眼睛沒有動。

        「你知道回來要再存六個金帝吧。」

        「我知道。」

        他笑了——你第一次看到他真的笑，笑起來比你想的年輕很多。

        「那你也要在。」他說，「你要有籍，有地方住，有名字。不然我回來要去哪裡找你？灰棚巷嗎？」

        「灰棚巷的人是會不見的。」

        第九日的早潮，他在跳板上回頭，這次沒有做那個動作。

        他大聲喊了一句，整個碼頭都聽見了——他喊的是你的名字。

        **這是這個世界第一次有人在人群裡大聲喊你的名字。**

        （他留了一張紙條：**「你的名字我會拼了。回來的時候要看到它寫在門上。」**）
    - label: 叫他別走
      cost:
        minutes: 60
      gain:
        npc:
          id: npc-quays-hand
          trust: -10
          affection: 5
      resultText: |-
        「留下來。」你說。

        他沒有立刻回答。他把布包綁好，站起來。

        「我就是怕這個。」

        他走了。

        第九日的早潮，他上了船。他沒有讓你去送。

        你是隔天在碼頭聽別人說的。

        ——你不確定你是為了他好才那樣說的，還是為了你自己。這個問題你想了很久。
