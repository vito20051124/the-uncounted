          tell: 對方沒有停。你被推倒在牆邊，錢袋被扯走了。
          injury: 挫傷
          loseCopper: 12
      resultText: 腳步聲停了幾秒，然後往另一個方向去了。
    - label: 掏出防狼噴霧
      requires:
        has:
          item: item-spray
      cost:
        minutes: 3
      spend:
        item: item-spray
      resultText: |-
        你按下去的時候自己也嗆到了。對方蹲在地上發出你沒聽過的聲音。
        你退著走出巷口。

        剩九次。
