  weight: 70
  text: |-
    她今天沒有擺攤。她在等你，手上拿著一張紙。

    「書記的位置，一個城只有一個。」她說，「他七十三歲了。」

    「他死了之後我接。接了之後我要一個學徒——不然我死了就沒有人接。」

    她把紙推過來。上面是她寫的字，工整得像印的：

    **「穗爾之徒。」**

    下面空著一行。

    「你認字，你握筆的方式奇怪但學得快，而且你不會把別人的話省掉。」

    她停了一下，第一次沒有看著你的眼睛。

    「我問過我自己這是不是因為我想要你留下來。」

    「我想了三天，答案是**兩個都有**。」

    「所以我分開問你。」
  choices:
    - label: 做她的學徒——朋友就好
      cost:
        minutes: 60
      gain:
        flag: bond-scribe-2
        npc:
          id: npc-market-scribe
          trust: 25
          affection: 10
          fact: ★ 你是穗爾的學徒
      resultText: |-
        你在那一行寫下你的名字。

        她看完，點頭，把紙折好收進袖子。

        「那另一個問題，」她說，語氣完全沒有變，「就當我沒問。」

        「明天卯時來，我教你磨墨。磨不好的話字會花，字花了信就不算。」

        她轉身要走，走了兩步回頭：

        「還有——**朋友這個位置也只有一個**。你也是佔了的。」

        她說完就走了，走得有點快。
    - label: 兩個都答應
      cost:
        minutes: 90
      gain:
        flag: romance-scribe
        npc:
          id: npc-market-scribe
          trust: 25
          affection: 30
          fact: ★ 你和穗爾在一起了
      resultText: |-
        你先在紙上寫下名字。然後你抬頭看她。

        「兩個都要。」

        她的耳朵紅了，但她的手沒有抖——她把紙接過去，折好，收進袖子，動作跟平常一模一樣。

        「好。」她說。

        然後她在原地站了很久，久到旁邊收攤的人都走光了。

        「我不太會這個。」她終於說，「我只會寫別人的。」

        你說沒關係，慢慢來。

        她點點頭，然後說了一句話，聲音很小，你差點沒聽見：

        「那你不要掉下來。」

        ——「不讓話在中間掉下來」是她的工作。這是她第一次把那個詞用在人身上。
    - label: 說你還不知道自己會不會留下來
      cost:
        minutes: 45
      gain:
        npc:
          id: npc-market-scribe
          trust: 10
          affection: -5
      resultText: |-
        她把紙收回去，很快，快到你來不及看清楚她的表情。

        「合理。」她說。

        「這座城一半的人都在等船。」

        她重新坐下，攤開單子。「明天還是有工。要不要跑？」

        ——她沒有生氣。她只是把那張紙收進了最底下那一疊。
  src: derived:npc-market-scribe；00_pillars.md 反 DoL 條款二：戀愛不開任何機制優勢
- id: ev-meet-hand
