    他看著你喘，沒有說話，也沒有走。

    過了一會兒他把袋子放下，從懷裡摸出一塊硬得像石頭的麵包，掰成兩半，遞過來一半。

    你伸手要接的時候他縮回去了一點。

    「你欠我半個。」他說，「記著。」

    然後才給你。
