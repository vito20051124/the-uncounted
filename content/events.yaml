  name: 貨棚之間的石階
- id: ev-grotto-hollowborn
  where:
    at: bh:grotto
  requires:
    has:
      item: item-keys
  once: true
  weight: 50
  text: |-
    一個寂裔老匠人放下鑿子，指了指你腰間掛著的那串鑰匙。
    他不說話——這條街上沒有人說話。他伸手，掌心朝上。

    你把鑰匙放上去。他就著洞口的光轉了兩圈，用拇指刮過齒緣，然後抬頭看你。
    那個眼神你認得：他知道這不是這裡的鋼。
  choices:
    - label: 讓他看
      cost:
        minutes: 25
      gain:
        flag: grotto-known
      resultText: |-
        他比了三個手勢，你一個也看不懂。然後他把鑰匙還給你，回去敲他的石頭。

        他沒有問你從哪來。這條街上的人不問這個——他們自己就是全城最被輕視的一群，而他們的身體跟你一樣不導靈血。
        世上唯一一群構造和你相同的人，是一群沒有人願意當的人。
    - label: 把鑰匙收回來
      cost:
        minutes: 5
      resultText: 他點了點頭，回去敲他的石頭。
  src: canon:canon-07 §4.1.4 她在體質上與寂裔同類
  name: 老匠人看你的鑰匙
