        「船期。」他說，「今天兩條，後天沒有。」
        他頓了一下。「後天別來，省得白站。」

        這是你在這座城裡得到的第一個有用的情報，而它是免費的。
  src: derived:熟識度改變錄取率之機制外顯
  name: 老克瓦記得你
- id: ev-meet-cinder-woman
  where:
    at: bh:cinder
  once: true
  weight: 60
  text: |-
    棚屋門口坐著一個灰裔女人，膝上攤著一本很厚的冊子，紙邊全是黑的。她沒有站起來。

    「新來的。」她說，眼睛盯著你的鞋，「城裡不收沒戶籍的。這裡收。」

    她翻開冊子。裡面密密麻麻寫著名字、棚號、欠款、以及一些被劃掉的行。被劃掉的那些，你猜是死了。

    「上不上？上了要幹活，不上就當我沒說。」
  choices:
    - label: 問這本冊子算什麼
      cost:
        minutes: 20
      gain:
        npc:
          id: npc-cinder-woman
          acquaintance: 15
          trust: 8
      resultText: |-
        「不算什麼。」她說得很平，「領事會不認，海關不認，教會也不認。」
        她合上冊子。「但你要是死在棚子裡，這本冊子是唯一會記下你名字的東西。」

        這是你來到這裡之後，第一次有人提到「記下你」這件事。
    - label: 說你再考慮
      cost:
        minutes: 5
      gain:
        npc:
          id: npc-cinder-woman
          acquaintance: 6
      resultText: 她聳肩，翻開下一頁。「隨時。反正這裡不會滿。」
  src: canon:districts.md#灰棚巷 灰盟難民自衛會；_reaches-geopolitics.md 灰盟難民無戶籍
  name: 初見灰姐
- id: ev-cinder-ledger
  where:
    at: bh:cinder
  requires:
    all:
      - npc:
          id: npc-cinder-woman
          axis: trust
          is: ">=20"
      - not:
          flag: on-cinder-ledger
  once: true
  weight: 70
  text: |-
    灰姐把冊子推到你面前，翻到最後一頁的空白處，遞來一支炭筆。

    「寫。」

    你看著那一行空格：名字、棚號、來處。
    第三欄她已經替你填好了——上面寫著「**不詳**」。

    「不詳」她也寫得很順手。這一頁上有一半的人來處都是不詳。
  choices:
    - label: 寫下名字
      cost:
        minutes: 30
      gain:
        flag: on-cinder-ledger
        npc:
          id: npc-cinder-woman
          trust: 15
          affection: 10
          fact: 你的名字
      resultText: |-
        你寫下去的時候手有點抖——不是因為冷。

        這不是戶籍。領事會不認，海關不認，教會也不認。
        但這是你來到這個世界之後，**第一次有人在數你**。

        灰姐把冊子收回去，看也沒看。「明天卯時到廢渣小路口。有活。」
    - label: 把「不詳」那一欄劃掉，寫下真話
      requires:
        npc:
          id: npc-cinder-woman
          axis: trust
          is: ">=40"
      cost:
        minutes: 40
      gain:
        flag: on-cinder-ledger
        npc:
          id: npc-cinder-woman
          trust: 25
          affection: 20
          fact: ★ 你來自另一個世界
      resultText: |-
        你把「不詳」劃掉，在旁邊寫了幾個字。

        灰姐看了很久，然後把冊子闔上。
        「我不懂你寫的是什麼意思。」她說，「但我也不會問。」
        她把炭筆收進圍裙。「這一頁上，有三個人的來處我也看不懂。他們也都還活著。」

        ——她沒有相信你，但她也沒有需要相信你。這比相信更難得。
    - label: 不寫
      cost:
        minutes: 5
      resultText: |-
        你把炭筆放回去。
        她沒有勸，只是把冊子收好。「不急。冊子不會跑。」
  src: canon:canon-07 §6 普查未及者；馬斯洛第 2 層「被登記」
  name: ★ 灰姐的冊子
- id: ev-meet-grotto-elder
  where:
    at: bh:grotto
  once: true
  weight: 60
  text: |-
    石窟街上沒有人說話。你走了兩百步，鑿子的聲音一下一下，沒有人抬頭。

    只有一個老匠人停了手。
    他放下鑿子，看了你一眼——不是看你的臉，是看你整個人。然後他做了一個手勢：食指在自己胸口點了一下，再指向你。

    你不懂那個手勢。但你隱約覺得，他不是在問你是誰。
  choices:
    - label: 學著把食指點在胸口，再指向他
      cost:
        minutes: 20
      gain:
        npc:
          id: npc-grotto-elder
          acquaintance: 18
          affection: 12
      resultText: |-
        他的眉毛動了一下。那大概是笑。
        他伸出手掌，掌心朝下，往下壓了兩次——你猜那是「坐」。

        你在洞壁邊坐了一會。鑿子的聲音沒有停。

        這是你來到這裡之後，第一次有人不因為你的口音、你的衣服、或你的來歷而看你。
        因為在這條街上，那個手勢的意思是：**你的身體跟我一樣。**
    - label: 搖頭表示看不懂
      cost:
        minutes: 10
      gain:
        npc:
          id: npc-grotto-elder
          acquaintance: 8
      resultText: |-
        他點了點頭，回去敲他的石頭。
        沒有失望，也沒有不耐。在這條街上，看不懂就是看不懂，沒有人會因此多說一個字。
  src: canon:districts.md#石窟街 寂裔緘默文化；canon-07 §4.1.4
  name: 初見石啞
- id: ev-grotto-teach-cold
  where:
    at: bh:grotto
  requires:
    npc:
      id: npc-grotto-elder
      axis: affection
      is: ">=25"
  once: true
  weight: 70
  text: |-
    石啞把你叫過去——用的是敲三下石頭的方式。

    他從懷裡拿出一小塊灰白的東西，放在你掌心。冷的。比周圍的空氣冷得多。
    然後他指了指你的手臂，做了一個割的動作，再把那塊東西按在自己手臂上。

    他重複了三次，直到你點頭。
  choices:
    - label: 記下來
      cost:
        minutes: 45
      gain:
        item: item-salve
        npc:
          id: npc-grotto-elder
          affection: 15
          trust: 20
      resultText: |-
        他教的是石窟街的傷口處置法：先用冷石壓住，再敷苦鹽苔。

        寂裔全族閉血，跟你一樣——他們永遠不能被光耀系治癒，所以他們花了幾百年把凡俗的傷口處置做到極致。
        這不是魔法，這是**一群不能用魔法的人累積了幾百年的辦法**。

        他塞給你一劑苦鹽苔藥膏，然後轉身回去敲石頭。
  src: canon:canon-07 §4.1.4 世上唯一與她同體質的族群；hollow-flora.md 化膿率 34%→21%
  name: ★ 石啞教你的事
- id: ev-dross-trace
  where:
    at: bh:alley
