  tell: 她問這個問題的時候，冊子沒有翻開。
  text: |-
    灰姐叫住你。

    「老鹽街後巷，第三個牆角。」她說，「那裡有一片新的滓。」

    你的背後涼了一下。

    「灰棚巷的人靠撿滓吃飯，什麼樣的滓我們都認得。」她盯著你的鞋，「那一片不是傾倒的，不是滲的，也不是燒出來的。它是**一次生出來的**——一次，然後就沒有了。」

    她終於抬起眼睛。「上一次我看到那種滓，是在星坑。」

    「那天晚上你在哪裡？」
  choices:
    - label: 說你不知道
      cost:
        minutes: 20
      gain:
        npc:
          id: npc-cinder-woman
          trust: -5
      resultText: |-
        她看了你很久，然後低頭翻開冊子。
        「行。」

        她沒有再問。但你知道她記住了——她那本冊子記的從來不只是名字。
    - label: 反問她那是什麼滓
      cost:
        minutes: 30
      gain:
        npc:
          id: npc-cinder-woman
          acquaintance: 8
        flag: dross-lead
      resultText: |-
        「元血級的。」她說得很輕，「一次放完，然後那個東西就空了。」

        「這種滓在這座城裡值多少錢，你不會想知道。因為知道的人已經死了兩個。」

        她把冊子闔上。「我什麼都沒說。你什麼都沒問。」

        ——你不知道自己撞進了什麼。但你知道那片結晶不是垃圾。
    - label: 告訴她實話
      requires:
        npc:
          id: npc-cinder-woman
          axis: trust
          is: ">=45"
      cost:
        minutes: 60
      gain:
        npc:
          id: npc-cinder-woman
          trust: 20
          affection: 15
          fact: ★ 那片殘滓是你造成的
        flag: dross-lead
      resultText: |-
        你講完之後，她沉默了很長一段時間。

        然後她說：「我不信。」

        停了一下。

        「但我也不信一片滓會自己長在牆角。所以我們兩個都有不信的東西。」

        她從圍裙裡掏出炭筆，在冊子的空白處畫了一個很小的記號。
        「這個記號的意思是『別問』。這裡有二十幾個人有這個記號。」

        「你現在也有了。」
  src: canon:canon-07 §3.1 抵達點的殘滓是物證但不指向裝置；灰盟遺物壟斷
  name: ★ 灰姐問起那天晚上
- id: ev-phone-photos
