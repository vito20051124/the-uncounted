      cost:
        minutes: 90
      gain:
        flag: bond-scribe-1
        npc:
          id: npc-market-scribe
          acquaintance: 12
          trust: 15
          affection: 8
      resultText: |-
        她愣了一下，然後把筆遞給你。

        「先寫你的名字。」

        你寫得很慢，也很醜。她在旁邊看著，沒有笑。

        「你握筆的方式很奇怪。」她說，「不是錯，是奇怪。像學過別的字。」

        你沒有回答。她也沒有追問——她從來不追問。

        那天晚上你多學了七個字。回去的路上你在心裡默寫了一路。
    - label: 問她為什麼一個字都不省
