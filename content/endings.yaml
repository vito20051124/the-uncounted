- id: end-hearth
  aim: aim-hearth
  name: 安家
  tagline: 一個地方，和一個人。
  asks: |-
    要一份租約（60 銅，付過一次），下一輪的租金已經在桌上，
    還要至少一個人真的把你當一回事（信任 50 以上，或一段戀愛關係）。
    身上不能有沒處置的傷。
    ★ 這是三條裡唯一用錢的一條，也理應是最緊的一條。
  requires:
    all:
      - flag: aim-hearth
      - flag: lease-signed
      - canAfford: item-room-lease
      - day: '>=28'
      - not:
          injury:
            untreated: true
      - any:
          - flag: romance-scribe
          - flag: romance-hand
          - all:
              - flag: bond-scribe-2
              - npc:
                  id: npc-market-scribe
                  axis: trust
                  is: '>=50'
          - all:
              - flag: bond-hand-2
              - npc:
                  id: npc-quays-hand
                  axis: trust
                  is: '>=50'
          - all:
              - flag: bond-grotto-1
              - npc:
                  id: npc-grotto-elder
                  axis: trust
                  is: '>=50'
          - all:
              - flag: on-cinder-ledger
              - npc:
                  id: npc-cinder-woman
                  axis: trust
                  is: '>=50'
          - all:
              - flag: bond-foreman-1
              - npc:
                  id: npc-quays-foreman
                  axis: trust
                  is: '>=55'
  text: |-
    第三十日的傍晚，你把第二輪的租金放在桌上。

    六十銅。不是給出去，是放在那裡——房東要月末才來收，而你想先看它一天。

    這間屋子在老鹽街，三樓，一扇窗，窗外是跨街的晾衣繩。

    你落地的那條巷子就在樓下。走了一整輪，你回到了原點——**但這次有門板。**

    灰姐說過：「你知道我們這裡最貴的東西是什麼嗎。是門板。有門板的棚子，晚上可以睡熟。」

    你今天晚上會睡熟。

    ---

    做的事沒有變。明天還是五點去碼頭，還是被挑或者不被挑，
    還是十五銅，還是要算著吃。

    你沒有階位。名冊上那一行「一年以後再測」還在那裡，你大概不會回去測了。
    石啞的印你也沒有拿——那批閥銷是別人押的印。

    你把那一輪的日子和那些機會，換成了一塊門板。

    ---

    天黑之後你把門關上，然後又打開，然後又關上。

    你不是在檢查鎖。你是在確認那個聲音——木頭撞到木框的那一聲，
    因為那一聲代表**外面和裡面是兩個地方**。

    這是你三十天以來第一次擁有一個「裡面」。
  gaveUp: |-
    · 那 60 銅是她一整輪的全部淨額。她把名冊上那一行和石啞的簽名換成一塊門板。
    · 闕的船票是六個金帝，一千四百四十銅——她永遠付不出。
      所以若他留下，不是她贖回他，是他自己不走了；而遊戲不會讓她確定那是不是後悔。
    · 若她選的是穗爾：穗爾留在鹵港，就會一直是「書記的學徒」，
      直到那個七十三歲、怕教人的書記死。
  src: 'canon:brinehaven/districts.md 老鹽街單間公寓月租 60 銅、密集的 3–4 層石木混造出租公寓與跨街晾衣繩；npcs.json 灰姐既有台詞「這裡最貴的東西是門板」'

- id: end-trade
  aim: aim-trade
  name: 立業
  tagline: 一件別人拿得走的東西上，有你的印記。
  asks: |-
    要有人指名要你的手藝（兩次以上），
    並且至少拿到一個承認：武館名冊上的一行、石啞在你做的東西上押的印、
    或穗爾借給你的那張桌子。
    身上不能有沒處置的傷。
    ★ 這一條【不要錢】。它的貨幣是日子與信任。
  requires:
    all:
      - flag: aim-trade
      - day: '>=28'
      - not:
          injury:
            untreated: true
      - namedAsks: '>=2'
      - any:
          - flag: rank-prentice-listed
          - flag: hollow-signed
          - all:
              - flag: bond-scribe-2
              - namedAsks: '>=3'
  text: |-
    第三十日，有人來找你。

    不是來救你，不是來教你，也不是因為你特別。是因為他手上有一件事，
    而他算過之後認為你做得比別人好。

    這件事發生過幾次了。你開始記得他們的臉。

    ---

    你沒有登頂。學徒要練一到兩年，師傅要八到十五年，宗師要三名現任宗師聯署——
    那些數字不在三十天裡面。

    名冊上那一行還是寫著「一年以後再測」。

    但你手上有一樣東西是三十天前沒有的：**一件事，而且是別人會為它來找你的那種事。**

    ---

    你也知道天花板在哪裡，而且你知道得很清楚——因為那個天花板不在你的手上。

    技階沒有天花板。canon 寫得很明白：技階是技藝評定，跟靈血品階無關，
    你可以被同行承認到宗師。

    有天花板的是**認證**。靈聾者無論技階多高，公會憑證封頂在鹽鐵級——
    六級裡的第二格。託管賞金上限二十金帝。

    所以你的痛不是「練不上去」。

    是**你能被同行承認為師傅，卻永遠拿不到別人拿認證去接的那些案子。**

    那份陳情書上有你的名字。它大概不會在你有生之年通過。
  gaveUp: |-
    · 門板。招牌與租金搶同一批銅、同一批日子。
    · 廣度。做招牌要專精，她會失去那三個認得她的人，和那十八個上工的日子。
    · 若走的是代筆那一條：她開始替不識字的人寫他們的名字，
      而她自己的名字在總帳上仍然是空的。
  src: 'canon:training-and-ranks.md 技階＝技藝評定與品階無關、學徒 1–2 年、師傅 8–15 年、宗師需 3 名現任宗師聯署；adventurers-and-wardens.md 靈聾者公會憑證封頂鹽鐵級、託管賞金上限 20 金帝；★ 兩軸明令不得相互推導'
