- id: job-pans-rake
  name: 蒸發池扒鹽
  at: bh:pans
  when:
    - 6
    - 14
  minutes: 420
  payCopper: 12
  hireChance: 1
  maxPerDay: 1
  requires:
    needs:
      stamina: ">20"
  costs:
    stamina: -40
    hygiene: -25
    hydration: -25
  risks:
    - chance: 0.14
      tell: 滷水泡了一整天，手背的皮開始裂。
      injury: 鹽蝕手
