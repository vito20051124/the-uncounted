      - knowsRoutes: ">=1"
      - needs:
          stamina: ">15"
  costs:
    stamina: -18
    hydration: -10
  tell: 派工的書記把你上下打量了一遍：「你認得路嗎？認不得路的我不用。」單子只剩兩張。
